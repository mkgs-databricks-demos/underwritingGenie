# 2X-Small serverless SQL warehouse for setup/reset SQL tasks and the Genie Agent.
# Deployed name in dev: "[dev <short_name>] uw_genie_warehouse" (var.name_prefix; uw-genie-agent looks it up by this name).
resources:
  sql_warehouses:
    uw_genie_warehouse:
      name: ${var.name_prefix}uw_genie_warehouse
      cluster_size: 2X-Small
      warehouse_type: PRO
      enable_serverless_compute: true
      min_num_clusters: 1
      max_num_clusters: 1
      auto_stop_mins: 10
      spot_instance_policy: COST_OPTIMIZED
      tags:
        custom_tags:
          - key: domain
            value: underwriting
          - key: data_class
            value: synthetic
