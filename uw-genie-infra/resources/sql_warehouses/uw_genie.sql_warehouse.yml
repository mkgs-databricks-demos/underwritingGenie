# Small serverless SQL warehouse for setup/reset SQL tasks and the Genie Agent.
# Sized up 2026-11-16 (was 2X-Small, 1 cluster, 10 min auto-stop): Genie One runs several
# agent queries in parallel, and the demo should not wait for a cold start (AC-2b-10, R1-14).
# Deployed name in dev: "[dev <short_name>] uw_genie_warehouse" (var.name_prefix; uw-genie-agent looks it up by this name).
resources:
  sql_warehouses:
    uw_genie_warehouse:
      name: ${var.name_prefix}uw_genie_warehouse
      cluster_size: Small
      warehouse_type: PRO
      enable_serverless_compute: true
      min_num_clusters: 1
      max_num_clusters: 2
      auto_stop_mins: 30
      spot_instance_policy: COST_OPTIMIZED
      tags:
        custom_tags:
          - key: domain
            value: underwriting
          - key: data_class
            value: synthetic
